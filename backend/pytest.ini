[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = .git .venv venv env __pycache__ node_modules
# Exclude test files in backend root (these are utility scripts, not pytest tests)
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --ignore=test_login_correct.py
    --ignore=test_login_direct.py
    --ignore=test_password.py
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=80
    --junitxml=junit.xml
    -o junit_family=legacy
asyncio_mode = auto
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests
    auth: Authentication tests
    api: API tests
    redis: Redis integration tests