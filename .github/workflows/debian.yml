name: Debian Build & Test

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      debian_version:
        description: 'Debian version to build'
        required: false
        default: 'bookworm'
        type: choice
        options:
          - 'bullseye'
          - 'bookworm'
          - 'trixie'
      build_package:
        description: 'Build Debian package'
        required: false
        default: true
        type: boolean

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  debian-build:
    name: Build on Debian ${{ matrix.debian_version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        debian_version: ['bullseye', 'bookworm', 'trixie']
        include:
          - debian_version: 'bullseye'
            debian_codename: 'bullseye'
            python_version: '3.9'
          - debian_version: 'bookworm'
            debian_codename: 'bookworm'
            python_version: '3.11'
          - debian_version: 'trixie'
            debian_codename: 'trixie'
            python_version: '3.12'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image for Debian ${{ matrix.debian_version }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: false
          tags: ggnet:debian-${{ matrix.debian_version }}
          build-args: |
            DEBIAN_VERSION=${{ matrix.debian_version }}
            PYTHON_VERSION=${{ matrix.python_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Test Docker image
        run: |
          docker run --rm ggnet:debian-${{ matrix.debian_version }} python --version
          docker run --rm ggnet:debian-${{ matrix.debian_version }} python -c "import fastapi; print('FastAPI OK')"
      
      - name: Save Docker image
        if: matrix.debian_version == 'bookworm'
        run: |
          docker save ggnet:debian-bookworm | gzip > ggnet-debian-bookworm.tar.gz
      
      - name: Upload Docker image artifact
        if: matrix.debian_version == 'bookworm'
        uses: actions/upload-artifact@v4
        with:
          name: ggnet-debian-bookworm-image
          path: ggnet-debian-bookworm.tar.gz
          retention-days: 7

  debian-install-test:
    name: Test Installation on Debian ${{ matrix.debian_version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        debian_version: ['bullseye', 'bookworm']
        include:
          - debian_version: 'bullseye'
            debian_codename: 'bullseye'
          - debian_version: 'bookworm'
            debian_codename: 'bookworm'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Create test container
        run: |
          docker run -d --name ggnet-test-${{ matrix.debian_version }} \
            --privileged \
            -v $(pwd):/workspace \
            debian:${{ matrix.debian_version }} \
            sleep infinity
      
      - name: Install dependencies in container
        run: |
          docker exec ggnet-test-${{ matrix.debian_version }} bash -c "
            apt-get update && \
            apt-get install -y \
              sudo \
              git \
              curl \
              wget \
              python3 \
              python3-pip \
              python3-venv \
              nodejs \
              npm \
              postgresql \
              redis-server \
              nginx \
              targetcli-fb \
              open-iscsi \
              qemu-utils \
              tftpd-hpa \
              isc-dhcp-server \
              build-essential \
              libpq-dev
          "
      
      - name: Test installation script syntax
        run: |
          docker exec ggnet-test-${{ matrix.debian_version }} bash -c "
            bash -n /workspace/scripts/install.sh && echo 'Install script syntax OK'
          "
      
      - name: Test Python imports
        run: |
          docker exec ggnet-test-${{ matrix.debian_version }} bash -c "
            cd /workspace/backend && \
            python3 -m venv /tmp/test-venv && \
            /tmp/test-venv/bin/pip install --upgrade pip && \
            /tmp/test-venv/bin/pip install -r requirements.txt && \
            /tmp/test-venv/bin/python -c 'from app.main import app; print(\"Backend imports OK\")'
          "
      
      - name: Test frontend build
        run: |
          docker exec ggnet-test-${{ matrix.debian_version }} bash -c "
            cd /workspace/frontend && \
            npm ci && \
            npm run build && \
            echo 'Frontend build OK'
          "
      
      - name: Cleanup
        if: always()
        run: |
          docker rm -f ggnet-test-${{ matrix.debian_version }} || true

  debian-package:
    name: Build Debian Package
    runs-on: ubuntu-latest
    needs: [debian-build, debian-install-test]
    if: github.event_name == 'workflow_dispatch' && inputs.build_package == true || startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get version from tag or commit
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(date +%Y%m%d%H%M%S)-$(git rev-parse --short HEAD)
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
      
      - name: Set up Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            devscripts \
            debhelper \
            dh-python \
            dh-nodejs \
            build-essential \
            fakeroot \
            lintian
      
      - name: Create Debian package structure
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p debian-package/ggnet-${VERSION}
          cp -r backend frontend scripts systemd debian-package/ggnet-${VERSION}/
          cp README.md LICENSE install.sh debian-package/ggnet-${VERSION}/
          
          cd debian-package/ggnet-${VERSION}
          
          # Create debian directory
          mkdir -p debian
          
          # Create control file
          cat > debian/control <<EOF
          Source: ggnet
          Section: net
          Priority: optional
          Maintainer: GGnet Team <team@ggnet.local>
          Build-Depends: debhelper-compat (= 13),
                         python3-all,
                         python3-setuptools,
                         dh-python,
                         nodejs,
                         npm,
                         build-essential
          Standards-Version: 4.6.0
          Homepage: https://github.com/itcaffenet-Ljubinje/GGnet
          
          Package: ggnet
          Architecture: all
          Depends: \${python3:Depends},
                   \${misc:Depends},
                   python3 (>= 3.9),
                   python3-pip,
                   python3-venv,
                   nodejs (>= 18),
                   npm (>= 9),
                   postgresql (>= 13),
                   redis-server,
                   nginx,
                   targetcli-fb,
                   open-iscsi,
                   qemu-utils,
                   tftpd-hpa,
                   isc-dhcp-server,
                   supervisor
          Description: GGnet Diskless Boot System
           Enterprise-grade diskless boot system for Windows 11 with UEFI SecureBoot support.
           Features include:
           - Windows 11 SecureBoot support
           - Zero manual configuration
           - Multi-architecture support (UEFI + Legacy BIOS)
           - Real-time monitoring with Grafana
           - Remote console (noVNC)
           - Hardware auto-detection
           - iSCSI boot from centralized storage
          EOF
          
          # Create changelog
          cat > debian/changelog <<EOF
          ggnet (${VERSION}) unstable; urgency=medium
          
            * Automated build from GitHub Actions
            * See https://github.com/itcaffenet-Ljubinje/GGnet for changelog
          
           -- GitHub Actions <noreply@github.com>  $(date -R)
          EOF
          
          # Create rules file
          cat > debian/rules <<'RULES'
          #!/usr/bin/make -f
          %:
          	dh $@
          
          override_dh_auto_install:
          	dh_auto_install
          	mkdir -p $(CURDIR)/debian/ggnet/opt/ggnet
          	mkdir -p $(CURDIR)/debian/ggnet/etc/ggnet
          	mkdir -p $(CURDIR)/debian/ggnet/var/lib/ggnet
          	mkdir -p $(CURDIR)/debian/ggnet/var/log/ggnet
          	cp -r backend frontend scripts $(CURDIR)/debian/ggnet/opt/ggnet/
          	cp install.sh $(CURDIR)/debian/ggnet/opt/ggnet/
          	cp -r systemd/* $(CURDIR)/debian/ggnet/etc/systemd/system/
          RULES
          chmod +x debian/rules
          
          # Create postinst script
          cat > debian/postinst <<'POSTINST'
          #!/bin/bash
          set -e
          
          if [ "$1" = "configure" ]; then
            # Run installation script
            if [ -f /opt/ggnet/install.sh ]; then
              chmod +x /opt/ggnet/install.sh
              /opt/ggnet/install.sh || true
            fi
          fi
          
          exit 0
          POSTINST
          chmod +x debian/postinst
          
          # Create prerm script
          cat > debian/prerm <<'PRERM'
          #!/bin/bash
          set -e
          
          if [ "$1" = "remove" ]; then
            systemctl stop ggnet-backend.service || true
            systemctl stop ggnet-worker.service || true
            systemctl stop ggnet-preflight.service || true
          fi
          
          exit 0
          PRERM
          chmod +x debian/prerm
          
          # Create compat file
          echo "13" > debian/compat
        env:
          VERSION: ${{ steps.version.outputs.version }}
      
      - name: Build Debian package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd debian-package/ggnet-${VERSION}
          dpkg-buildpackage -us -uc -b
      
      - name: Lint Debian package
        run: |
          lintian debian-package/*.deb || true
      
      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ggnet-debian-package
          path: debian-package/*.deb
          retention-days: 30
      
      - name: Create release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cat > RELEASE_NOTES.md <<EOF
          # GGnet Release ${VERSION}
          
          Built on: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          Commit: ${{ github.sha }}
          
          ## Installation
          
          \`\`\`bash
          sudo dpkg -i ggnet_${VERSION}_all.deb
          sudo apt-get install -f
          \`\`\`
          
          ## Files
          
          - \`ggnet_${VERSION}_all.deb\` - Debian package
          EOF
      
      - name: Upload release notes
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          retention-days: 30

