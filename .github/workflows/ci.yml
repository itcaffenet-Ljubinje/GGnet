name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-contrib
          sudo systemctl start postgresql
          sudo -u postgres psql -c "CREATE USER ggnet WITH PASSWORD 'test_password';" || true
          sudo -u postgres psql -c "CREATE DATABASE ggnet OWNER ggnet;" || true
          sudo -u postgres psql -c "ALTER USER ggnet CREATEDB;" || true
          sudo -u postgres psql -c "ALTER USER ggnet WITH SUPERUSER;" || true
      
      - name: Install Redis
        run: |
          sudo apt-get install -y redis-server
          sudo systemctl start redis-server
          redis-cli ping
      
      - name: Install system dependencies
        run: |
          sudo apt-get install -y libmagic1 libpq-dev build-essential
      
      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if sudo -u postgres psql -c "SELECT 1;" > /dev/null 2>&1; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 1
          done
      
      - name: Install Python dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run database migrations
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql+asyncpg://ggnet:test_password@localhost:5432/ggnet"
          REDIS_URL: "redis://localhost:6379"
          SECRET_KEY: "test-secret-key-for-ci"
        run: |
          python -c "from app.core.database import Base, async_engine; import asyncio; from app.models import user, image, machine, target, session, audit, writeback, snapshot, scheduled_job, batch_operation, vm, client, boot_event; asyncio.run(Base.metadata.create_all(bind=async_engine))" || true
      
      - name: Run pytest with coverage
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql+asyncpg://ggnet:test_password@localhost:5432/ggnet"
          REDIS_URL: "redis://localhost:6379"
          SECRET_KEY: "test-secret-key-for-ci"
        run: |
          # Run pytest and capture exit code
          set +e
          pytest --cov --cov-report=xml --cov-report=term-missing --junitxml=junit.xml -o junit_family=legacy
          pytest_exit_code=$?
          set -e
          
          # Only create dummy XML if pytest didn't run at all (e.g., import errors)
          # If tests failed, pytest will have created junit.xml with failures
          if [ ! -f junit.xml ]; then
            echo "Warning: junit.xml not generated, creating empty test suite report"
            echo '<?xml version="1.0" encoding="utf-8"?><testsuites><testsuite name="pytest" tests="0" failures="0" errors="0" skipped="0" time="0"></testsuite></testsuites>' > junit.xml
          fi
          
          # Exit with pytest's exit code to fail CI on test failures
          exit $pytest_exit_code
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
      
      - name: Verify JUnit XML exists
        if: always()
        working-directory: ./backend
        run: |
          if [ ! -f junit.xml ]; then
            echo '<?xml version="1.0" encoding="utf-8"?><testsuites><testsuite name="pytest" tests="0" failures="0" errors="0" skipped="0" time="0"></testsuite></testsuites>' > junit.xml
          fi
      
      - name: Upload test results to Codecov
        if: always()
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/junit.xml
          flags: backend
          name: backend-test-results
          fail_ci_if_error: false
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            backend/junit.xml
            backend/coverage.xml
            backend/htmlcov/
          retention-days: 30

  frontend-lint:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Verify package-lock.json exists
        working-directory: ./frontend
        run: |
          if [ -f package-lock.json ]; then
            echo "✓ package-lock.json found"
            ls -lh package-lock.json
          else
            echo "⚠️ package-lock.json not found, will generate it"
          fi
      
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./frontend
        run: |
          if [ ! -f package-lock.json ]; then
            echo "package-lock.json not found, generating it..."
            npm install --package-lock-only
          fi
          npm ci
      
      - name: Type check
        working-directory: ./frontend
        run: npm run type-check
      
      - name: Lint
        working-directory: ./frontend
        run: npm run lint

  frontend-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Verify package-lock.json exists
        working-directory: ./frontend
        run: |
          if [ -f package-lock.json ]; then
            echo "✓ package-lock.json found"
            ls -lh package-lock.json
          else
            echo "⚠️ package-lock.json not found, will generate it"
          fi
      
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./frontend
        run: |
          if [ ! -f package-lock.json ]; then
            echo "package-lock.json not found, generating it..."
            npm install --package-lock-only
          fi
          npm ci
      
      - name: Run unit tests with coverage
        working-directory: ./frontend
        run: npm run test:coverage
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./frontend/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: frontend/coverage/
          retention-days: 30

  frontend-e2e:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Verify package-lock.json exists
        working-directory: ./frontend
        run: |
          if [ -f package-lock.json ]; then
            echo "✓ package-lock.json found"
            ls -lh package-lock.json
          else
            echo "⚠️ package-lock.json not found, will generate it"
          fi
      
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-contrib
          sudo systemctl start postgresql
          sudo -u postgres psql -c "CREATE USER ggnet WITH PASSWORD 'test_password';" || true
          sudo -u postgres psql -c "CREATE DATABASE ggnet OWNER ggnet;" || true
          sudo -u postgres psql -c "ALTER USER ggnet CREATEDB;" || true
          sudo -u postgres psql -c "ALTER USER ggnet WITH SUPERUSER;" || true
      
      - name: Install Redis
        run: |
          sudo apt-get install -y redis-server
          sudo systemctl start redis-server
          redis-cli ping
      
      - name: Install system dependencies
        run: |
          sudo apt-get install -y libmagic1 libpq-dev build-essential
      
      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if sudo -u postgres psql -c "SELECT 1;" > /dev/null 2>&1; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 1
          done
      
      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium
      
      - name: Set up test database
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql+asyncpg://ggnet:test_password@localhost:5432/ggnet"
          REDIS_URL: "redis://localhost:6379"
          SECRET_KEY: "test-secret-key-for-ci"
        run: |
          python -c "from app.core.database import Base, async_engine; import asyncio; from app.models import user, image, machine, target, session, audit, writeback, snapshot, scheduled_job, batch_operation, vm, client, boot_event; asyncio.run(Base.metadata.create_all(bind=async_engine))" || true
          python backend/scripts/create_admin.py --username admin --password admin123 --email admin@test.local || true
      
      - name: Build frontend
        working-directory: ./frontend
        env:
          VITE_API_URL: "http://localhost:8000"
        run: npm run build
      
      - name: Run E2E tests
        working-directory: ./frontend
        env:
          CI: true
          DATABASE_URL: "postgresql+asyncpg://ggnet:test_password@localhost:5432/ggnet"
          REDIS_URL: "redis://localhost:6379"
          SECRET_KEY: "test-secret-key-for-ci"
        run: npm run test:e2e
      
      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30
      
      - name: Upload Playwright trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: frontend/test-results/
          retention-days: 30

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
      
      - name: Check backend imports
        working-directory: ./backend
        run: |
          python -c "from app.main import app; print('Backend imports OK')"
